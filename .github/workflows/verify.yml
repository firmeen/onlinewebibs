name: OIC Python validation
on:
  push:
    branches:
      - "feat/oic-query-designer-parallel"
  pull_request:
    paths:
      - "*.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/verify.yml"
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax and imports
        run: |
          python -m compileall -q oic_collector.py oic_parallel_collector.py oic_query.py
          python -c "import oic_query, oic_collector, oic_parallel_collector"
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
